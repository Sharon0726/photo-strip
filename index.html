<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Photo Booth - Index</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle, rgb(255 228 164) 5%, rgb(255 227 227) 40%, rgb(255 255 255)90%);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      margin: 20px auto;
      max-width: 1100px;
      width: min(95%, 1100px);
      padding: 0 12px 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 20px 0;
    }

    .countdown {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.7);
      padding: 10px 15px;
      border-radius: 50%;
      font-size: 1.5rem;
      font-weight: bold;
      display: none;
      /* 預設不顯示，拍照時再顯示 */
    }

    .preview-area {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(12px, 3vw, 20px);
      flex-wrap: wrap;
      position: relative;
    }

    .camera-wrapper {
      position: relative;
      /* 疊加明星照用 */
      overflow: hidden;
      /* 確保不會因為內容擴大 */
      width: min(100%, 390px);
      margin: 0 auto;
    }

    video {
      width: 100%;
      aspect-ratio: 13 / 10;
      height: auto;
      background: #fff;
      border: 2px solid#000 ;
      transform: scaleX(-1);
      object-fit: cover;
      max-width: 98%;
    }

    /* 疊加合照 PNG：絕對定位在 video 上方 */
    #starOverlay {
      position: absolute;
      bottom: 5px;
      right: 1%;
      width: 150px;
      height: auto;
      display: none;
      pointer-events: none;
    }

    .thumbnails {
      position: relative;
      /* 疊加明星照用 */
      overflow: hidden;
      /* 確保不會因為內容擴大 */
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      max-width: 390px;
      width: min(100%, 390px);
      justify-content: center;
      margin: 10px auto 0;
    }

    .thumbnails img {
      width: 100%;
      aspect-ratio: 13 / 10;
      height: auto;
      border: 2px solid #000;
      background: #fff;
      object-fit: cover;
      max-width: 90%;
    }

    .filters {
      margin: 20px 0;
    }

    .filters button {
      margin: 5px;
      padding: 8px 12px;
      border: 2px solid #000;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
    }

    .filters button.active {
      background: #ffe1ee;
      font-weight: bold;
    }

    #captureBtn {
      margin-top: 10px;
      padding: 10px 20px;
      border: 2px solid #000;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    /* 合照區塊 */
    .coShot {
      margin: 10px 0;
    }

    #overlayControls {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 10px;
      border: 2px dashed #000;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.6);
    }

    .size-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-slider-wrap input[type="range"] {
      width: 160px;
      accent-color: #ff8fb1;
    }

    .position-buttons {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 6px;
    }

    .position-buttons button {
      padding: 6px 10px;
      border: 2px solid #000;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .position-buttons button.active {
      background: #ffe1ee;
      font-weight: bold;
    }

    .capture-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    #retakeBtn,
    #nextBtn {
      padding: 10px 20px;
      border: 2px solid #000;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.35rem;
      }

      .thumbnails {
        grid-template-columns: 1fr;
      }

      .filters button,
      #captureBtn,
      #retakeBtn,
      #nextBtn,
      #coShotBtn {
        width: min(100%, 320px);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Photo Booth - Take Photos</h1>

    <!-- 合照選擇 -->
    <div class="coShot">
      <button id="coShotBtn">合照</button>
      <input type="file" id="overlayUpload" accept="image/png" style="display:none;" />

      <div id="overlayControls" style="display:none;">
        <div class="size-slider-wrap">
          <span>小</span>
          <input type="range" id="overlaySizeSlider" min="60" max="300" value="150" />
          <span>大</span>
        </div>
        <div class="position-buttons">
          <button type="button" class="pos-btn" data-pos="top-left">左上</button>
          <button type="button" class="pos-btn" data-pos="top-right">右上</button>
          <button type="button" class="pos-btn" data-pos="bottom-left">左下</button>
          <button type="button" class="pos-btn active" data-pos="bottom-right">右下</button>
        </div>
        <button type="button" id="removeOverlayBtn">移除合照圖片</button>
      </div>
    </div>

    <div class="preview-area">
      <!-- 攝影機預覽區 -->
      <div class="camera-wrapper">
        <video id="video" autoplay muted playsinline></video>
        <div id="countdown" class="countdown">3</div>
        <!-- 疊加明星去背照 -->
        <img id="starOverlay" src="" alt="Star Overlay" />
      </div>


    </div>
    <!-- 拍完的照片縮圖 -->
    <div class="thumbnails" id="thumbnails"></div>
    <!-- 濾鏡選擇按鈕 -->
    <div class="filters">
      <span>Choose a filter!</span><br />
      <button class="filter-btn active" data-filter="none">No Filter</button>
      <button class="filter-btn" data-filter="grayscale(100%)">Grayscale</button>
      <button class="filter-btn" data-filter="sepia(100%)">Sepia</button>
      <button class="filter-btn" data-filter="contrast(120%) saturate(70%)">Vintage</button>
      <button class="filter-btn" data-filter="brightness(110%) blur(1px)">Soft</button>
    </div>

    <!-- 拍照按鈕 -->
    <div class="capture-controls">
      <button id="captureBtn">Start Capture</button>
      <button id="retakeBtn" style="display:none;">重拍</button>
      <button id="nextBtn" style="display:none;">下一張</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const countdownEl = document.getElementById('countdown');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const nextBtn = document.getElementById('nextBtn');
    const thumbnails = document.getElementById('thumbnails');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // 合照（上傳去背 PNG）
    const coShotBtn = document.getElementById('coShotBtn');
    const overlayUpload = document.getElementById('overlayUpload');
    const overlayControls = document.getElementById('overlayControls');
    const overlaySizeSlider = document.getElementById('overlaySizeSlider');
    const posButtons = document.querySelectorAll('.pos-btn');
    const removeOverlayBtn = document.getElementById('removeOverlayBtn');
    const starOverlay = document.getElementById('starOverlay');

    let overlayImageLoaded = false; // 是否已上傳合照圖片
    let overlaySize = parseInt(overlaySizeSlider.value, 10); // 疊加圖片寬度 (px)
    let overlayPosition = 'bottom-right'; // 疊加圖片位置：top-left / top-right / bottom-left / bottom-right
    const overlayMarginX = 5; // 對應 CSS 中 right: 1% 的近似邊距
    const overlayMarginY = 5; // 對應 CSS 中 bottom: 5px

    // 點擊「合照」開啟檔案選擇視窗，讓使用者上傳去背過的 PNG
    coShotBtn.addEventListener('click', () => {
      overlayUpload.click();
    });

    overlayUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        starOverlay.src = evt.target.result;
        starOverlay.style.display = 'block';
        overlayImageLoaded = true;
        overlayControls.style.display = 'flex';
        applyOverlayStyle();
      };
      reader.readAsDataURL(file);
    });

    // 拖拉圓點（range slider）調整合照圖片大小
    overlaySizeSlider.addEventListener('input', (e) => {
      overlaySize = parseInt(e.target.value, 10);
      applyOverlayStyle();
    });

    // 四個角落按鈕調整合照圖片位置
    posButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        posButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        overlayPosition = btn.getAttribute('data-pos');
        applyOverlayStyle();
      });
    });

    // 移除已上傳的合照圖片
    removeOverlayBtn.addEventListener('click', () => {
      overlayImageLoaded = false;
      starOverlay.src = '';
      starOverlay.style.display = 'none';
      overlayControls.style.display = 'none';
      overlayUpload.value = '';
    });

    // 依照目前的大小與位置設定，更新預覽區中疊加圖片的樣式
    function applyOverlayStyle() {
      starOverlay.style.height = 'auto';
      starOverlay.style.width = overlaySize + 'px';
      starOverlay.style.top = 'auto';
      starOverlay.style.bottom = 'auto';
      starOverlay.style.left = 'auto';
      starOverlay.style.right = 'auto';

      if (overlayPosition === 'top-left') {
        starOverlay.style.top = overlayMarginY + 'px';
        starOverlay.style.left = overlayMarginX + 'px';
      } else if (overlayPosition === 'top-right') {
        starOverlay.style.top = overlayMarginY + 'px';
        starOverlay.style.right = overlayMarginX + 'px';
      } else if (overlayPosition === 'bottom-left') {
        starOverlay.style.bottom = overlayMarginY + 'px';
        starOverlay.style.left = overlayMarginX + 'px';
      } else {
        starOverlay.style.bottom = overlayMarginY + 'px';
        starOverlay.style.right = overlayMarginX + 'px';
      }
    }

    // 取得攝影機影像
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user", // 選擇前置相機
        width: { ideal: 390 }, // 設定適當寬度
        height: { ideal: 300 }  // 設定適當高度
      }
    })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => {
        console.error("無法存取攝影機: ", err);
      });

    let currentFilter = 'none';
    let photoCount = 0;
    const maxPhotos = 4;
    const capturedPhotos = []; // 用於暫存 4 張 Base64 資料


    // 切換濾鏡
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        // 移除舊的 active
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        video.style.filter = currentFilter;
      });
    });

    // 倒數拍照
    function startCountdown(seconds) {

      return new Promise(resolve => {
        let counter = seconds;
        countdownEl.style.display = 'block';
        countdownEl.textContent = counter;
        const timer = setInterval(() => {
          counter--;
          countdownEl.textContent = counter;
          if (counter <= 0) {
            clearInterval(timer);
            countdownEl.style.display = 'none';
            resolve();
          }
        }, 1000);
      });
    }

    // 拍照並顯示縮圖
    async function capturePhoto() {

      // 建立 Canvas 拍照
      const canvas = document.createElement('canvas');
      canvas.width = 390;
      canvas.height = 300;
      const ctx = canvas.getContext('2d');

      // 套用相同的 CSS 濾鏡在 canvas 繪製前
      ctx.filter = currentFilter;

      // 倒數 3 秒
      await startCountdown(3);
      // 先把攝影機畫面繪製上去
      ctx.save(); // 儲存當前畫布狀態

      // 水平翻轉 (鏡像)
      ctx.translate(390, 0);  // 移動畫布
      ctx.scale(-1, 1);       // 反轉 X 軸
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore(); // 恢復畫布狀態

      // 如果有上傳合照 PNG，依目前的大小與位置疊加上去
      if (overlayImageLoaded && starOverlay.src) {
        const overlayImg = new Image();
        overlayImg.crossOrigin = "anonymous";
        overlayImg.src = starOverlay.src;
        await new Promise((resolve) => {
          if (overlayImg.complete) {
            resolve();
          } else {
            overlayImg.onload = resolve;
          }
        });
        const overlayWidth = overlaySize;
        const overlayHeight = overlayWidth * (overlayImg.height / overlayImg.width);
        let x, y;
        if (overlayPosition === 'top-left') {
          x = overlayMarginX;
          y = overlayMarginY;
        } else if (overlayPosition === 'top-right') {
          x = canvas.width - overlayWidth - overlayMarginX;
          y = overlayMarginY;
        } else if (overlayPosition === 'bottom-left') {
          x = overlayMarginX;
          y = canvas.height - overlayHeight - overlayMarginY;
        } else {
          x = canvas.width - overlayWidth - overlayMarginX;
          y = canvas.height - overlayHeight - overlayMarginY;
        }
        ctx.drawImage(overlayImg, x, y, overlayWidth, overlayHeight);
      }

      // 轉成 Base64
      const dataURL = canvas.toDataURL('image/png');
      capturedPhotos.push(dataURL);

      // 在右邊顯示縮圖
      const img = document.createElement('img');
      img.src = dataURL;
      thumbnails.appendChild(img);

      photoCount++;
    }

    // 按下拍照：只拍 1 張，拍完後顯示「重拍」與「下一張／完成」按鈕
    captureBtn.addEventListener('click', async () => {
      captureBtn.style.display = 'none';
      await capturePhoto();
      retakeBtn.style.display = 'inline-block';
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (photoCount >= maxPhotos) ? '完成' : '下一張';
    });

    // 重拍：只重拍剛剛那一張，移除最後一張暫存照片與縮圖
    retakeBtn.addEventListener('click', () => {
      if (photoCount > 0) {
        capturedPhotos.pop();
        thumbnails.removeChild(thumbnails.lastChild);
        photoCount--;
      }
      retakeBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      captureBtn.style.display = 'inline-block';
    });

    // 下一張／完成：未滿 4 張則繼續拍下一張，滿 4 張則儲存並跳轉到 photo.html
    nextBtn.addEventListener('click', () => {
      if (photoCount >= maxPhotos) {
        localStorage.setItem('photoStrip', JSON.stringify(capturedPhotos));
        window.location.href = 'photo.html';
      } else {
        retakeBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        captureBtn.style.display = 'inline-block';
      }
    });
  </script>
</body>

</html>
